<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a73e8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self';" />
  <link rel="manifest" href="./manifest.json" />
  <title>HK Invoice Manager</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Clean up service worker from production builds when running in dev mode
    if (location.hostname === 'localhost' && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
