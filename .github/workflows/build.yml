name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        shell: pwsh

      - run: npx tsc --noEmit
        shell: pwsh

      - run: npm run test:unit
        shell: pwsh

      - run: npm run package
        shell: pwsh

      - name: Zip portable app
        run: Compress-Archive -Path out/hkinv-win32-x64/* -DestinationPath out/hkinv-portable.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: hkinv-portable
          path: out/hkinv-portable.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hkinv-portable
          path: .

      - uses: softprops/action-gh-release@v2
        with:
          files: hkinv-portable.zip
          generate_release_notes: true
