name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run test:unit

      - run: npm run build

      - name: Package distribution
        run: |
          mkdir hkinv-webapp
          cp hkinv.bat serve.ps1 hkinv-webapp/
          cp -r dist hkinv-webapp/
          zip -r hkinv-webapp.zip hkinv-webapp/

      - uses: actions/upload-artifact@v4
        with:
          name: hkinv-webapp
          path: hkinv-webapp.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hkinv-webapp
          path: .

      - uses: softprops/action-gh-release@v2
        with:
          files: hkinv-webapp.zip
          generate_release_notes: true
